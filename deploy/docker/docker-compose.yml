services:
  postgres:
    image: postgres:17-alpine
    container_name: aipm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipm_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aipm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: localhost/aipm-api:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: aipm_api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aipm}:${POSTGRES_PASSWORD:-aipm_local_dev}@postgres:5432/${POSTGRES_DB:-aipm}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/app/data}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://10.92.20.201:9528,http://localhost:9528}
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: localhost/aipm-web:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: aipm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
    name: aipm_postgres_data
