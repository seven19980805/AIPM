services:
  api:
    image: localhost/aipm-api:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aipm_api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-False}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/rqmd.sqlite3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
    expose:
      - "8000"

  web:
    image: localhost/aipm-web:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_GO_CODING_URL: ${VITE_GO_CODING_URL:-http://localhost:8888}
    container_name: aipm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
